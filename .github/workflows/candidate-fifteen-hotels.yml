name: Final fifteen-hotel candidate materialization
on:
  push:
    branches: [release/20260913-fifteen-hotels]
    paths: ["candidate-fifteen.trigger"]
permissions:
  contents: write
concurrency:
  group: belek-ny-final-candidate
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble and validate final candidate
        env:
          ACCEPTED_CANDIDATE: "845fdad411b27c9bb934d16492846de0ae8530aa"
          DRIVE_HTML_FILE_ID: "1ujohc5SxxAKPfN9_D992PGkAjdDsGzvW"
          DRIVE_PDF_FILE_ID: "1ehz9z4MH3h6vaERvJGaOR8ZPaDK5-3es"
          EXPECTED_HTML_SHA256: "cf3536867a3280abb3d00b5e4fad58c92e07f0bcc1497bdeb0d650326f6f8658"
          EXPECTED_PDF_SHA256: "2504797d970260f3eeb18d665a84923871b490c263e7b0c5f492c5a13e3ffed8"
        run: |
          set -euo pipefail
          git fetch origin main release/20260913-fifteen-hotels
          git checkout "$ACCEPTED_CANDIDATE" -- \
            data/current-price-state.json \
            data/room-category-registry.json \
            data/hotel-site-links.json \
            data/public-price-summary.json \
            data/price-update-state.json \
            docs/HOTEL_RANKING_CRITERIA_CURRENT.md \
            docs/EDITORIAL_COMMUNICATION_ACCEPTANCE_CURRENT.md \
            docs/TEXT_STYLE_SOURCE_OF_TRUTH.md \
            docs/HOTEL_SITE_MONITORING_REPORT_RULE.md \
            scripts/validate_consistency.py \
            scripts/validate_hotel_site_language.py \
            scripts/validate_public_copy.py \
            scripts/validate_mobile_navigation.py
          git checkout origin/main -- scripts/build_pdf_source.py scripts/extract_price_update_state.py

          CACHE_BUST="${GITHUB_RUN_ID}-$(date +%s)"
          curl -L --fail --retry 3 -H "Cache-Control: no-cache" \
            "https://drive.usercontent.google.com/download?id=${DRIVE_HTML_FILE_ID}&export=download&confirm=t&cachebust=${CACHE_BUST}" -o index.html
          curl -L --fail --retry 3 -H "Cache-Control: no-cache" \
            "https://drive.usercontent.google.com/download?id=${DRIVE_PDF_FILE_ID}&export=download&confirm=t&cachebust=${CACHE_BUST}" -o belek_new_year_comparison_2026_2027_current.pdf
          echo "${EXPECTED_HTML_SHA256}  index.html" | sha256sum -c -
          echo "${EXPECTED_PDF_SHA256}  belek_new_year_comparison_2026_2027_current.pdf" | sha256sum -c -

          cat > docs/SITE_STRUCTURE_CANON_CURRENT.md <<'EOF'
          # BELEK NY: Site Structure Canon

          **Status:** CURRENT

          The public site has exactly eight top-level blocks, in this fixed order:
          `hero` -> `ranking` -> `cards` -> `prices` -> `extras` -> `gastro` -> `pdf-download` -> `shortlist`.

          The former standalone `booking-readiness` / «Бронирование» block is removed and must not return. Future releases may update content inside these blocks, but must not add, remove, rename or reorder top-level blocks unless the user explicitly changes this canon. `scripts/validate_consistency.py` fails closed on structure drift.
          EOF
          sed -i 's/^          //' docs/SITE_STRUCTURE_CANON_CURRENT.md

          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/validate_consistency.py')
          t=p.read_text(encoding='utf-8')
          if 'class CanonicalStructureParser' not in t:
              insert='''\nfrom html.parser import HTMLParser\nclass CanonicalStructureParser(HTMLParser):\n    VOID={"area","base","br","col","embed","hr","img","input","link","meta","param","source","track","wbr"}\n    def __init__(self): super().__init__(convert_charrefs=True); self.stack=[]; self.blocks=[]\n    def handle_starttag(self,tag,attrs):\n        tag=tag.lower(); parent=self.stack[-1] if self.stack else None\n        if tag=="section" and parent=="main":\n            d=dict(attrs); self.blocks.append("hero" if "hero" in (d.get("class") or "").split() else d.get("id"))\n        if tag not in self.VOID: self.stack.append(tag)\n    def handle_endtag(self,tag):\n        tag=tag.lower()\n        if tag in self.stack:\n            while self.stack:\n                if self.stack.pop()==tag: break\n_structure=CanonicalStructureParser(); _structure.feed(html)\n_expected=["hero","ranking","cards","prices","extras","gastro","pdf-download","shortlist"]\nassert _structure.blocks==_expected, f"canonical top-level block structure drift: {_structure.blocks} != {_expected}"\nassert 'id="booking-readiness"' not in html and "id='booking-readiness'" not in html, "forbidden standalone booking block returned"\n'''
              marker="m = re.search(r'data-report-version"
              pos=t.find(marker); assert pos!=-1
              p.write_text(t[:pos]+insert+'\n'+t[pos:],encoding='utf-8')
          PY

          python -m pip install --quiet beautifulsoup4 pypdf
          python scripts/extract_price_update_state.py
          python scripts/build_pdf_source.py
          python scripts/validate_hotel_site_language.py
          python scripts/validate_mobile_navigation.py
          python scripts/validate_public_copy.py
          python scripts/validate_consistency.py
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          assert h.count('class="hotel-card')==15
          assert 'Papillon Belvil' in h
          assert 'booking-readiness' not in h and 'Финальная тройка: готовность к бронированию' not in h
          r=PdfReader('belek_new_year_comparison_2026_2027_current.pdf')
          text='\n'.join((p.extract_text() or '') for p in r.pages)
          version=re.search(r'data-report-version=["\']([^"\']+)',h).group(1)
          assert len(r.pages)==19 and version in text and 'Papillon Belvil' in text
          assert 'Финальная тройка: готовность к бронированию' not in text
          assert '2026-09-12T00:11:00+03:00' in Path('data/price-update-state.json').read_text(encoding='utf-8')
          print('final candidate PASS',version,'pages=',len(r.pages))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html belek_new_year_comparison_2026_2027_current.pdf report/BELEK_NY_REPORT_SOURCE.html \
            data/current-price-state.json data/room-category-registry.json data/hotel-site-links.json data/public-price-summary.json data/price-update-state.json \
            docs/HOTEL_RANKING_CRITERIA_CURRENT.md docs/EDITORIAL_COMMUNICATION_ACCEPTANCE_CURRENT.md docs/TEXT_STYLE_SOURCE_OF_TRUTH.md docs/HOTEL_SITE_MONITORING_REPORT_RULE.md docs/SITE_STRUCTURE_CANON_CURRENT.md \
            scripts/validate_consistency.py scripts/validate_hotel_site_language.py scripts/validate_public_copy.py scripts/validate_mobile_navigation.py
          git diff --cached --quiet && { echo "No candidate diff" >&2; exit 1; }
          git commit -m "candidate: final fifteen-hotel photo release"
          git push origin HEAD:release/20260913-fifteen-hotels
