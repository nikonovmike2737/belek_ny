name: Manual fifteen-hotel production cutover
on:
  push:
    branches: [release/20260913-fifteen-hotels]
    paths: ["candidate-fifteen.trigger"]
permissions:
  contents: write
concurrency:
  group: belek-ny-manual-prod-cutover
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble one production commit from accepted candidate and canonical Drive
        env:
          EXPECTED_MAIN: "a5706c4f5d1fa119bd70652d5a73a3cf1f537a56"
          ACCEPTED_CANDIDATE: "845fdad411b27c9bb934d16492846de0ae8530aa"
          DRIVE_HTML_FILE_ID: "1ujohc5SxxAKPfN9_D992PGkAjdDsGzvW"
          DRIVE_PDF_FILE_ID: "1ehz9z4MH3h6vaERvJGaOR8ZPaDK5-3es"
          EXPECTED_HTML_SHA256: "9a02ff9e09226741f3e9b73d47b2680368a8956fd5242975c552f49328d6ae81"
          EXPECTED_PDF_SHA256: "489667be461ba2d7e5511860369423e045d6d158458e346d6d0030f374c8ec33"
        run: |
          set -euo pipefail
          git fetch origin main release/20260913-fifteen-hotels
          CURRENT_MAIN="$(git rev-parse origin/main)"
          test "$CURRENT_MAIN" = "$EXPECTED_MAIN" || { echo "main moved: $CURRENT_MAIN" >&2; exit 1; }
          git reset --hard origin/main

          git checkout "$ACCEPTED_CANDIDATE" -- \
            data/current-price-state.json \
            data/room-category-registry.json \
            data/hotel-site-links.json \
            data/public-price-summary.json \
            data/price-update-state.json \
            docs/HOTEL_RANKING_CRITERIA_CURRENT.md \
            docs/EDITORIAL_COMMUNICATION_ACCEPTANCE_CURRENT.md \
            docs/TEXT_STYLE_SOURCE_OF_TRUTH.md \
            docs/HOTEL_SITE_MONITORING_REPORT_RULE.md \
            scripts/validate_consistency.py \
            scripts/validate_hotel_site_language.py \
            scripts/validate_public_copy.py \
            scripts/validate_mobile_navigation.py

          CACHE_BUST="${GITHUB_RUN_ID}-$(date +%s)"
          curl -L --fail --retry 3 -H "Cache-Control: no-cache" \
            "https://drive.usercontent.google.com/download?id=${DRIVE_HTML_FILE_ID}&export=download&confirm=t&cachebust=${CACHE_BUST}" -o index.html
          curl -L --fail --retry 3 -H "Cache-Control: no-cache" \
            "https://drive.usercontent.google.com/download?id=${DRIVE_PDF_FILE_ID}&export=download&confirm=t&cachebust=${CACHE_BUST}" -o belek_new_year_comparison_2026_2027_current.pdf
          echo "${EXPECTED_HTML_SHA256}  index.html" | sha256sum -c -
          echo "${EXPECTED_PDF_SHA256}  belek_new_year_comparison_2026_2027_current.pdf" | sha256sum -c -

          cat > docs/SITE_STRUCTURE_CANON_CURRENT.md <<'EOF'
          # BELEK NY: Site Structure Canon

          **Status:** CURRENT  
          **Effective from:** urgent manual release 2026-09-13  
          **Scope:** public HTML and generated PDF source.

          ## Binding rule

          The canonical website structure is fixed. Future product, data, editorial, price and hotel updates may change content inside the existing blocks, but must not add, remove, rename or reorder top-level site blocks unless the user explicitly changes this canon.

          The former top-level `booking-readiness` / «Бронирование» block is removed and is forbidden as a standalone block. Booking-related facts, when useful, must be placed inside an existing canonical block without changing the structure.

          ## Canonical top-level order

          1. `hero`
          2. `ranking`
          3. `cards`
          4. `prices`
          5. `extras`
          6. `gastro`
          7. `pdf-download`
          8. `shortlist`

          This exact count and order are release invariants for both desktop and mobile. The release validator must fail closed if the sequence changes or `booking-readiness` returns.
          EOF
          sed -i 's/^          //' docs/SITE_STRUCTURE_CANON_CURRENT.md

          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/validate_consistency.py')
          t=p.read_text(encoding='utf-8')
          if 'class CanonicalStructureParser' not in t:
              insert='''\n# Canonical top-level site structure: fixed by explicit user instruction.\nfrom html.parser import HTMLParser\nclass CanonicalStructureParser(HTMLParser):\n    VOID = {"area","base","br","col","embed","hr","img","input","link","meta","param","source","track","wbr"}\n    def __init__(self):\n        super().__init__(convert_charrefs=True)\n        self.stack=[]\n        self.blocks=[]\n    def handle_starttag(self, tag, attrs):\n        tag=tag.lower()\n        parent=self.stack[-1] if self.stack else None\n        if tag=="section" and parent=="main":\n            d=dict(attrs)\n            ident=d.get("id")\n            classes=(d.get("class") or "").split()\n            self.blocks.append("hero" if "hero" in classes else ident)\n        if tag not in self.VOID:\n            self.stack.append(tag)\n    def handle_startendtag(self, tag, attrs):\n        return\n    def handle_endtag(self, tag):\n        tag=tag.lower()\n        if tag in self.stack:\n            while self.stack:\n                cur=self.stack.pop()\n                if cur==tag:\n                    break\n\n_structure=CanonicalStructureParser(); _structure.feed(html)\n_expected_blocks=["hero","ranking","cards","prices","extras","gastro","pdf-download","shortlist"]\nassert _structure.blocks == _expected_blocks, f"canonical top-level block structure drift: {_structure.blocks} != {_expected_blocks}"\nassert 'id="booking-readiness"' not in html and "id='booking-readiness'" not in html, "forbidden standalone booking block returned"\n'''
              marker="m = re.search(r'data-report-version"
              pos=t.find(marker)
              assert pos!=-1
              t=t[:pos]+insert+'\n'+t[pos:]
              p.write_text(t,encoding='utf-8')

          a=Path('docs/EDITORIAL_COMMUNICATION_ACCEPTANCE_CURRENT.md')
          txt=a.read_text(encoding='utf-8')
          if '## Urgent structure hotfix 2026-09-13' not in txt:
              txt+='''\n\n## Urgent structure hotfix 2026-09-13\n\nExplicit user decision: remove the standalone «Бронирование» block. The canonical public structure is now frozen to eight top-level blocks in this order: hero, ranking, cards, prices, extras, gastro, pdf-download, shortlist. No future release may change the count or order without a new explicit user instruction. `scripts/validate_consistency.py` enforces this fail-closed. The final PDF has 19 pages after removing the standalone booking section. Public copy and hotel/ranking/price semantics outside the removed block are unchanged by this hotfix.\n'''
              a.write_text(txt,encoding='utf-8')
          PY

          python scripts/extract_price_update_state.py
          python scripts/build_pdf_source.py
          python scripts/validate_hotel_site_language.py
          python scripts/validate_mobile_navigation.py
          python scripts/validate_public_copy.py
          python scripts/validate_consistency.py
          python -m pip install --quiet pypdf
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          import re
          h=Path('index.html').read_text(encoding='utf-8')
          assert 'id="booking-readiness"' not in h and "id='booking-readiness'" not in h
          assert h.count('class="hotel-card') == 15
          assert 'Papillon Belvil' in h
          r=PdfReader('belek_new_year_comparison_2026_2027_current.pdf')
          text='\n'.join((p.extract_text() or '') for p in r.pages)
          version=re.search(r'data-report-version=["\']([^"\']+)',h).group(1)
          assert len(r.pages)==19
          assert version in text and 'Papillon Belvil' in text
          assert 'Финальная тройка: готовность к' not in text and 'БРОНИРОВАНИЕ' not in text
          assert '2026-09-12T00:11:00+03:00' in Path('data/price-update-state.json').read_text(encoding='utf-8')
          print('manual release acceptance PASS',version,'pages=',len(r.pages))
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            index.html \
            belek_new_year_comparison_2026_2027_current.pdf \
            report/BELEK_NY_REPORT_SOURCE.html \
            data/current-price-state.json \
            data/room-category-registry.json \
            data/hotel-site-links.json \
            data/public-price-summary.json \
            data/price-update-state.json \
            docs/HOTEL_RANKING_CRITERIA_CURRENT.md \
            docs/EDITORIAL_COMMUNICATION_ACCEPTANCE_CURRENT.md \
            docs/TEXT_STYLE_SOURCE_OF_TRUTH.md \
            docs/HOTEL_SITE_MONITORING_REPORT_RULE.md \
            docs/SITE_STRUCTURE_CANON_CURRENT.md \
            scripts/validate_consistency.py \
            scripts/validate_hotel_site_language.py \
            scripts/validate_public_copy.py \
            scripts/validate_mobile_navigation.py
          git diff --cached --quiet && { echo "No production diff" >&2; exit 1; }
          git commit -m "feat: publish fifteen-hotel comparison and lock site structure"
          test "$(git rev-list --count HEAD ^origin/main)" -eq 1
          git push origin HEAD:main
