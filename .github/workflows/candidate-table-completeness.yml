name: Candidate table completeness
on:
  push:
    branches: [release/20260913-table-completeness]
    paths: [.github/table-completeness-trigger]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch, validate and build
        run: |
          set -euo pipefail
          python -m pip install --quiet beautifulsoup4 pypdf
          python scripts/patch_table_completeness_release.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('data/price-update-state.json'); d=json.loads(p.read_text())
          assert d['current_price_update_at']=='2026-09-12T00:11:00+03:00'
          d['report_version']='20260913T070254Z'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          python scripts/build_pdf_source.py
          python scripts/validate_hotel_site_language.py
          python scripts/validate_mobile_navigation.py
          python scripts/validate_public_copy.py
          python scripts/validate_consistency.py
          chromium-browser --headless --no-sandbox --disable-gpu --no-pdf-header-footer \
            --print-to-pdf="$(pwd)/belek_new_year_comparison_2026_2027_current.pdf" \
            "file://$(pwd)/report/BELEK_NY_REPORT_SOURCE.html" || \
          google-chrome --headless --no-sandbox --disable-gpu --no-pdf-header-footer \
            --print-to-pdf="$(pwd)/belek_new_year_comparison_2026_2027_current.pdf" \
            "file://$(pwd)/report/BELEK_NY_REPORT_SOURCE.html"
          python - <<'PY'
          from bs4 import BeautifulSoup
          from pathlib import Path
          from pypdf import PdfReader
          h=Path('index.html').read_text(encoding='utf-8'); s=BeautifulSoup(h,'html.parser')
          hotels=['Calista Luxury Resort','Delphin Be Grand Resort','Papillon Belvil','Delphin Imperial Antalya','Concorde De Luxe Resort']
          for sid in ['prices','extras','gastro']:
              rows=s.find(id=sid).find('table').find_all('tr')[1:]
              names=[r.find_all(['td','th'])[0].get_text(' ',strip=True) for r in rows]
              assert len(names)==15,(sid,len(names))
              for x in hotels: assert any(x in n for n in names),(sid,x)
          r=PdfReader('belek_new_year_comparison_2026_2027_current.pdf')
          text='\n'.join((p.extract_text() or '') for p in r.pages)
          assert 'Финальная тройка: готовность к бронированию' not in text
          assert '20260913T070254Z' in text
          assert 19 <= len(r.pages) <= 24,len(r.pages)
          print('candidate PASS pages=',len(r.pages))
          PY
      - name: Commit candidate
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html report/BELEK_NY_REPORT_SOURCE.html belek_new_year_comparison_2026_2027_current.pdf data/price-update-state.json
          git diff --cached --quiet && { echo 'No candidate diff'; exit 1; }
          git commit -m 'candidate: complete all 15 hotels across comparison tables'
          git push origin HEAD:release/20260913-table-completeness
