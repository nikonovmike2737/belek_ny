name: Sync current Belek NY HTML and PDF from Google Drive

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-current-artifacts.yml"
      - "index.html"
      - "belek_new_year_comparison_2026_2027_current.pdf"
      - "report/BELEK_NY_REPORT_SOURCE.html"
      - "data/current-price-state.json"
      - "data/price-update-state.json"
      - "data/hotel-site-links.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: belek-ny-current-artifacts
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download canonical artifacts
        env:
          DRIVE_HTML_FILE_ID: "1ujohc5SxxAKPfN9_D992PGkAjdDsGzvW"
          DRIVE_PDF_FILE_ID: "1ehz9z4MH3h6vaERvJGaOR8ZPaDK5-3es"
        run: |
          set -euo pipefail
          CACHE_BUST="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"
          curl -L --fail --retry 3 -H "Cache-Control: no-cache" \
            "https://drive.usercontent.google.com/download?id=${DRIVE_HTML_FILE_ID}&export=download&confirm=t&cachebust=${CACHE_BUST}" \
            -o index.html.new
          curl -L --fail --retry 3 -H "Cache-Control: no-cache" \
            "https://drive.usercontent.google.com/download?id=${DRIVE_PDF_FILE_ID}&export=download&confirm=t&cachebust=${CACHE_BUST}" \
            -o drive-current.pdf

          test -s index.html.new
          grep -qi "<!DOCTYPE html" index.html.new
          grep -qi "Отель на замену Bellis" index.html.new
          test -s drive-current.pdf
          test "$(head -c 5 drive-current.pdf)" = "%PDF-"
          mv index.html.new index.html

      - name: Maintain structured state and validate release gates
        run: |
          set -euo pipefail
          test -s data/hotel-site-links.json
          python scripts/bootstrap_price_state.py
          python scripts/extract_price_update_state.py
          python scripts/build_pdf_source.py
          python scripts/validate_hotel_site_language.py
          python scripts/validate_mobile_navigation.py
          python scripts/validate_public_copy.py
          python scripts/validate_consistency.py

      - name: Select or regenerate matching PDF
        run: |
          set -euo pipefail
          python -m pip install --quiet pypdf
          VERSION="$(python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r'data-report-version=["\']([^"\']+)', html)
          if not m:
              raise SystemExit('HTML report version missing')
          print(m.group(1))
          PY
          )"

          pdf_has_version() {
            local pdf="$1"
            PDF_PATH="$pdf" REPORT_VERSION="$VERSION" python - <<'PY'
          from os import environ
          from pypdf import PdfReader
          text = '\n'.join((p.extract_text() or '') for p in PdfReader(environ['PDF_PATH']).pages)
          raise SystemExit(0 if environ['REPORT_VERSION'] in text else 1)
          PY
          }

          if pdf_has_version drive-current.pdf; then
            echo "Drive PDF matches HTML report version"
            mv drive-current.pdf belek_new_year_comparison_2026_2027_current.pdf
          elif [ -s belek_new_year_comparison_2026_2027_current.pdf ] && pdf_has_version belek_new_year_comparison_2026_2027_current.pdf; then
            echo "Drive public download is stale; retaining checked-in matching PDF"
            rm -f drive-current.pdf
          else
            echo "Drive public download is stale; regenerating PDF from canonical HTML"
            CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
            if [ -z "$CHROME" ]; then
              echo "No Chromium-compatible browser available for PDF regeneration" >&2
              exit 1
            fi
            "$CHROME" --headless --no-sandbox --disable-gpu --no-pdf-header-footer \
              --print-to-pdf="$(pwd)/belek_new_year_comparison_2026_2027_current.pdf.new" \
              "file://$(pwd)/report/BELEK_NY_REPORT_SOURCE.html"
            test -s belek_new_year_comparison_2026_2027_current.pdf.new
            test "$(head -c 5 belek_new_year_comparison_2026_2027_current.pdf.new)" = "%PDF-"
            mv belek_new_year_comparison_2026_2027_current.pdf.new belek_new_year_comparison_2026_2027_current.pdf
            rm -f drive-current.pdf
          fi

          pdf_has_version belek_new_year_comparison_2026_2027_current.pdf
          echo "version-match PASS ${VERSION}"

      - name: Verify release is complete in one production commit
        run: |
          set -euo pipefail
          FILES="index.html belek_new_year_comparison_2026_2027_current.pdf data/current-price-state.json data/price-update-state.json report/BELEK_NY_REPORT_SOURCE.html"
          if git diff --quiet -- $FILES && [ -z "$(git ls-files --others --exclude-standard $FILES)" ]; then
            echo "One-commit release invariant PASS: no post-commit artifact drift"
            exit 0
          fi

          echo "Release invariant FAIL: canonical Drive or generated state differs from the production commit." >&2
          echo "Do not create an automatic follow-up commit. Rebuild the complete release state and publish it in one production commit." >&2
          git status --short -- $FILES >&2
          git diff -- $FILES >&2 || true
          exit 1
