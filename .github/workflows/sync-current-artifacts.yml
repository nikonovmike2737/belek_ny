name: Sync current Belek NY HTML and PDF from Google Drive

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-current-artifacts.yml"
      - ".github/belek-sync-trigger"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: belek-ny-current-artifacts
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download canonical HTML and PDF
        env:
          DRIVE_HTML_FILE_ID: "1ujohc5SxxAKPfN9_D992PGkAjdDsGzvW"
          DRIVE_PDF_FILE_ID: "1ehz9z4MH3h6vaERvJGaOR8ZPaDK5-3es"
        run: |
          set -euo pipefail
          CACHE_BUST="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"
          curl -L --fail --retry 3 -H "Cache-Control: no-cache" \
            "https://drive.usercontent.google.com/download?id=${DRIVE_HTML_FILE_ID}&export=download&confirm=t&cachebust=${CACHE_BUST}" \
            -o index.html.new
          curl -L --fail --retry 3 -H "Cache-Control: no-cache" \
            "https://drive.usercontent.google.com/download?id=${DRIVE_PDF_FILE_ID}&export=download&confirm=t&cachebust=${CACHE_BUST}" \
            -o belek_new_year_comparison_2026_2027_current.pdf.new

          test -s index.html.new
          grep -qi "<!DOCTYPE html" index.html.new
          grep -qi "Отель на замену Bellis" index.html.new

          test -s belek_new_year_comparison_2026_2027_current.pdf.new
          test "$(head -c 5 belek_new_year_comparison_2026_2027_current.pdf.new)" = "%PDF-"

          mv index.html.new index.html
          mv belek_new_year_comparison_2026_2027_current.pdf.new \
             belek_new_year_comparison_2026_2027_current.pdf

      - name: Maintain structured state and PDF source
        run: |
          set -euo pipefail
          python scripts/bootstrap_price_state.py
          python scripts/build_pdf_source.py
          python scripts/validate_consistency.py

      - name: Verify HTML and PDF report version match
        run: |
          set -euo pipefail
          python -m pip install --quiet pypdf
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          m = re.search(r'data-report-version=["\']([^"\']+)', html)
          if not m:
              raise SystemExit('HTML report version missing')
          version = m.group(1)
          text = '\n'.join((p.extract_text() or '') for p in PdfReader('belek_new_year_comparison_2026_2027_current.pdf').pages)
          if version not in text:
              raise SystemExit(f'PDF does not contain HTML report version {version}')
          print('version-match PASS', version)
          PY

      - name: Commit only when changed
        run: |
          set -euo pipefail
          FILES="index.html belek_new_year_comparison_2026_2027_current.pdf data/current-price-state.json report/BELEK_NY_REPORT_SOURCE.html"
          if git diff --quiet -- $FILES && [ -z "$(git ls-files --others --exclude-standard $FILES)" ]; then
            echo "No artifact changes"
            exit 0
          fi
          git config user.name "belek-ny-drive-sync"
          git config user.email "belek-ny-drive-sync@users.noreply.github.com"
          git add $FILES
          git commit -m "chore: sync current Belek NY report"
          git push
